<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 助手 - WebMD 模拟器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 20px;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .card-ai {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 2rem;
            overflow: hidden;
        }
        .card-ai-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 1.2rem 1.5rem;
        }
        .chat-area {
            padding: 1.5rem;
            height: 450px;
            overflow-y: auto;
            background: #fafafa;
        }
        .message {
            margin-bottom: 1rem;
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.1rem;
        }
        .message-user .message-avatar {
            background: #6a11cb;
            color: white;
            order: 1;
            margin-left: 10px;
        }
        .message-ai .message-avatar {
            background: #0f3460;
            color: white;
            margin-right: 10px;
        }
        .message-content {
            max-width: 80%;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .message-user .message-content {
            background: #6a11cb;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message-ai .message-content {
            background: white;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .message-user { justify-content: flex-end; }
        .message-ai { justify-content: flex-start; }

        .input-area {
            padding: 1rem 1.5rem;
            border-top: 1px solid #eee;
            background: white;
        }
        .chat-input {
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            padding: 0.6rem 1.2rem;
            resize: none;
            transition: border-color 0.2s;
        }
        .chat-input:focus {
            border-color: #6a11cb;
            box-shadow: none;
        }
        .btn-send {
            border-radius: 50%;
            width: 44px;
            height: 44px;
            background: #6a11cb;
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-send:hover {
            background: #5a0cb3;
            transform: scale(1.05);
        }
        .btn-send:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6a11cb;
            animation: typingBounce 1.4s infinite ease-in-out;
            display: inline-block;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .step-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .step-thinking { background: #fff3cd; color: #856404; }
        .step-分析 { background: #e3f2fd; color: #0d47a1; }
        .step-下载 { background: #e8f5e9; color: #1b5e20; }
        .step-成功 { background: #d4edda; color: #155724; }
        .step-警告 { background: #fff3cd; color: #856404; }
        .step-配置 { background: #e0f2f1; color: #004d40; }
        .step-完成 { background: #c8e6c9; color: #1b5e20; }

        .params-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-top: 6px;
            font-size: 0.85rem;
        }
        .params-box td {
            padding: 2px 8px;
            border: none;
        }
        .params-box td:first-child {
            color: #6c757d;
            width: 120px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-cpu me-2"></i>WebMD 模拟器
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="submit.html">提交任务</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="gaussian.html">量子化学</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="ai_assistant.html">AI 助手</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="run.html">运行任务</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="results.html">结果展示</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card-ai">
                    <div class="card-ai-header d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-robot fs-2 me-3"></i>
                            <div>
                                <h4 class="mb-0"><strong>AI 模拟助手</strong></h4>
                                <small class="opacity-75">用自然语言描述，AI 自动完成分子动力学模拟配置</small>
                            </div>
                        </div>
                        <button class="btn btn-outline-light btn-sm" onclick="clearChat()">
                            <i class="bi bi-plus-circle me-1"></i>新对话
                        </button>
                    </div>

                    <div class="chat-area" id="chat-messages">
                        <div class="message message-ai">
                            <div class="message-avatar"><i class="bi bi-robot"></i></div>
                            <div class="message-content">
                                <strong>你好！我是 WebMD AI 助手</strong>
                                <p class="mb-1 mt-2">我可以帮你：</p>
                                <ul class="mb-0 ps-3">
                                    <li>通过 PDB ID 自动下载蛋白质结构</li>
                                    <li>从 PubChem 获取配体分子</li>
                                    <li>智能配置力场、水模型和模拟参数</li>
                                    <li>一键启动完整的 MD 模拟</li>
                                </ul>
                                <p class="mb-0 mt-2">试试说：<br>
                                <code class="d-block mt-1 p-1 bg-light rounded">模拟 1AKI 蛋白</code>
                                <code class="d-block mt-1 p-1 bg-light rounded">1AKI 配体阿司匹林 加对接</code></p>
                            </div>
                        </div>
                    </div>

                    <div class="input-area">
                        <form id="chat-form" autocomplete="off">
                            <div class="input-group">
                                <textarea class="form-control chat-input" id="message-input"
                                    rows="1" placeholder="输入你的需求，例如：模拟 1AKI 蛋白，配体用阿司匹林..."
                                    style="overflow:hidden;"></textarea>
                                <button type="submit" class="btn-send ms-2" id="send-btn">
                                    <i class="bi bi-send-fill"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.protocol === 'file:' ? 'http://192.168.16.130:5000' : window.location.origin;
        const chatMessages = document.getElementById('chat-messages');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const chatForm = document.getElementById('chat-form');

        let sessionId = localStorage.getItem('ai_session_id');
        if (!sessionId) {
            sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            localStorage.setItem('ai_session_id', sessionId);
        }

        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        function addMessage(type, html) {
            const typingIndicator = document.getElementById('typing-msg');
            if (typingIndicator) typingIndicator.remove();
            const div = document.createElement('div');
            div.className = 'message message-' + type;
            div.innerHTML = html;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'message message-ai';
            div.id = 'typing-msg';
            div.innerHTML = `
                <div class="message-avatar"><i class="bi bi-robot"></i></div>
                <div class="message-content">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <span style="font-size:0.85rem;color:#666;margin-left:8px;">AI 正在思考...</span>
                </div>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showSteps(steps) {
            const icons = { '思考': 'bi-brain', '分析': 'bi-search', '下载': 'bi-cloud-download',
                '成功': 'bi-check-circle', '警告': 'bi-exclamation-triangle', '配置': 'bi-sliders', '完成': 'bi-flag' };
            for (const step of steps) {
                const icon = icons[step.type] || 'bi-arrow-right';
                addMessage('ai',
                    '<div class="message-avatar"><i class="bi bi-robot"></i></div>' +
                    '<div class="message-content">' +
                    '<span class="step-badge step-' + step.type + '"><i class="' + icon + ' me-1"></i>' + step.type + '</span>' +
                    step.content + '</div>');
            }
        }

        function showTaskLinks(taskId, params) {
            let extra = '';
            if (params) {
                extra = '<div class="params-box"><table>';
                extra += '<tr><td>力场</td><td><strong>' + (params.force_field || 'AMBER99SB-ILDN') + '</strong></td></tr>';
                extra += '<tr><td>水模型</td><td><strong>' + (params.water_model || 'TIP3P') + '</strong></td></tr>';
                extra += '<tr><td>温度</td><td><strong>' + (params.temperature || 300) + ' K</strong></td></tr>';
                extra += '<tr><td>pH</td><td><strong>' + (params.ph || 7.0) + '</strong></td></tr>';
                extra += '<tr><td>模拟时间</td><td><strong>' + (params.simulation_time_ps || 1000) + ' ps</strong></td></tr>';
                if (params.enable_docking) extra += '<tr><td>分子对接</td><td><span class="text-success"><strong>已启用</strong></span></td></tr>';
                extra += '</table></div>';
            }
            addMessage('ai',
                '<div class="message-avatar"><i class="bi bi-robot"></i></div>' +
                '<div class="message-content">' +
                '任务 <strong>' + taskId + '</strong> 已创建并启动！' + extra +
                '<div class="mt-2">' +
                '<a href="run.html?task_id=' + taskId + '" class="btn btn-sm btn-primary"><i class="bi bi-play-circle me-1"></i>查看运行进度</a> ' +
                '<a href="results.html?task_id=' + taskId + '" class="btn btn-sm btn-outline-success"><i class="bi bi-bar-chart me-1"></i>查看结果</a>' +
                '</div></div>');
        }

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            const escaped = document.createElement('div');
            escaped.textContent = text;
            addMessage('user',
                '<div class="message-content">' + escaped.innerHTML + '</div>' +
                '<div class="message-avatar"><i class="bi bi-person"></i></div>');
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendBtn.disabled = true;
            addTyping();

            try {
                const response = await fetch(API_BASE + '/api/ai-assistant', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, session_id: sessionId })
                });
                const data = await response.json();

                const typingMsg = document.getElementById('typing-msg');
                if (typingMsg) typingMsg.remove();

                if (!response.ok) {
                    addMessage('ai',
                        '<div class="message-avatar"><i class="bi bi-robot"></i></div>' +
                        '<div class="message-content"><span class="text-danger">' + (data.error || '请求失败') + '</span></div>');
                    sendBtn.disabled = false;
                    return;
                }

                if (data.action === 'run_simulation' && data.task_id) {
                    if (data.steps) showSteps(data.steps);
                    showTaskLinks(data.task_id, data.params);
                } else if (data.action === 'run_simulation') {
                    addMessage('ai',
                        '<div class="message-avatar"><i class="bi bi-robot"></i></div>' +
                        '<div class="message-content">' + data.reply + '</div>');
                } else {
                    addMessage('ai',
                        '<div class="message-avatar"><i class="bi bi-robot"></i></div>' +
                        '<div class="message-content">' + data.reply + '</div>');
                }

                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (err) {
                const typingMsg = document.getElementById('typing-msg');
                if (typingMsg) typingMsg.remove();
                addMessage('ai',
                    '<div class="message-avatar"><i class="bi bi-robot"></i></div>' +
                    '<div class="message-content"><span class="text-danger">网络连接失败：' + err.message + '</span></div>');
            }
            sendBtn.disabled = false;
        });

        function clearChat() {
            sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            localStorage.setItem('ai_session_id', sessionId);
            chatMessages.innerHTML =
                '<div class="message message-ai">' +
                '<div class="message-avatar"><i class="bi bi-robot"></i></div>' +
                '<div class="message-content"><strong>已开启新对话！</strong><br>有什么需要帮忙的吗？</div></div>';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
